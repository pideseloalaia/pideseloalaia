name: Publicar en Instagram

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a publicar (AAAA-MM-DD). Vacio = hoy"
        required: false
        default: ""
      dry_run:
        description: "Solo mostrar lo que se publicaria"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          FECHA: ${{ inputs.fecha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/publicar.py
